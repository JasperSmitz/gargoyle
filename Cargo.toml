[workspace]
resolver = "3"
members = ["crates/gargoyle-core", "crates/gargoyle-collector", "crates/gargoyle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false

[workspace.dependencies]
gargoyle-core = { path = "crates/gargoyle-core" }
gargoyle-collector = { path = "crates/gargoyle-collector" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
clap = { version = "4", features = ["derive"] }
humantime-serde = "1"
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
