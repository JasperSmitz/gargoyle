[workspace]
resolver = "3"
members = ["crates/gargoyle-core", "crates/gargoyle-collector", "crates/gargoyle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false

[workspace.dependencies]
gargoyle-core = { path = "crates/gargoyle-core" }
gargoyle-collector = { path = "crates/gargoyle-collector" }

anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
base64ct = { version = "1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
humantime-serde = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustix = { version = "1", features = ["fs", "termios"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# argon2 at its production cost is slow unoptimized; `hash-password`, logins in `make dev` and
# the tests stay fast.
[profile.dev.package.argon2]
opt-level = 3

# `make release`. Panics stay `unwind`, not the `abort` ROADMAP M6.1 suggests: the scheduler
# turns a panicking collector call into a "collector crashed" error (a JoinError from
# spawn_blocking), storage reuses its connection after a panicked write, and tokio confines a
# panicking request handler to its own connection task. With `abort`, each of those bugs would
# kill the whole process instead. The size saving (a few hundred KiB) is not worth that.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
